<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Romaneio • GPS do entregador</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}
header{background:#111827;color:#fff;padding:18px 16px}
.brand{font-size:22px;font-weight:800}
.sub{opacity:.75;font-size:13px;margin-top:4px}
main{max-width:600px;margin:auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
input{width:100%;padding:13px;border:1px solid #ccd3da;border-radius:10px;font-size:16px}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:#111827;color:#fff;margin-top:10px}
button.stop{background:#b42318}
button.retry{background:#e9edf1;color:#17202a}
button:disabled{opacity:.55}
.muted{color:#66717d;font-size:13px;line-height:1.5}
.coords{font-family:monospace;background:#f1f3f5;border-radius:10px;padding:12px;word-break:break-word}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9ca3af;margin-right:7px}
.on{background:#16a34a}.warn{background:#f59e0b}.err{background:#dc2626}
.notice{padding:12px;border-radius:10px;background:#fff7ed;color:#9a3412;font-size:13px;margin-top:12px}
.ok{padding:12px;border-radius:10px;background:#f0fdf4;color:#166534;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<header>
<div class="brand">ROMANEIO</div>
<div class="sub">GPS do entregador</div>
</header>

<main>
<div class="card">
<h2>🏍️ Identificação</h2>

<label>Nome do entregador</label>
<input id="nome" placeholder="Ex.: João">

<label>ID do entregador</label>
<input id="id" placeholder="Ex.: joao01">

<label>Pedido atual (opcional)</label>
<input id="pedido" placeholder="Ex.: #125">

<button id="start">📍 Iniciar rastreamento</button>
<button id="stop" class="stop" hidden>■ Parar rastreamento</button>
<button id="retry" class="retry" hidden>🔄 Tentar novamente</button>

<div id="msg" class="muted">Aguardando ativação.</div>
</div>

<div class="card">
<div>
<span id="dot" class="dot"></span>
<b id="state">Aguardando</b>
</div>

<p class="muted">Última posição:</p>

<div id="coords" class="coords">
Nenhuma posição enviada.
</div>

<p id="last" class="muted"></p>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>
(() => {

let watchId = null;
let lastSent = 0;
let started = false;

const $ = id => document.getElementById(id);

const saved = JSON.parse(
  localStorage.getItem("romaneio_entregador") || "{}"
);

$("nome").value = saved.nome || "";
$("id").value = saved.id || "";
$("pedido").value = saved.pedido || "";

function cfg(){
  return window.ROMANEIO_SUPABASE;
}

function saveLocal(payload){
  localStorage.setItem(
    "ultima_localizacao",
    JSON.stringify(payload)
  );
}

async function sendPosition(payload){

  saveLocal(payload);

  if(!navigator.onLine){

    $("msg").textContent =
      "📴 Sem internet. A posição foi salva neste aparelho.";

    return false;
  }

  try{

    const c = cfg();

    if(!c || !c.url || !c.anonKey){
      throw new Error("Supabase não configurado.");
    }

    const client =
      window.supabase.createClient(
        c.url,
        c.anonKey
      );

    const { error } =
      await client
        .from(c.table)
        .upsert(
          payload,
          { onConflict:"entregador_id" }
        );

    if(error) throw error;

    $("msg").textContent =
      "🟢 Localização enviada ao painel.";

    return true;

  }catch(error){

    console.error(error);

    $("msg").textContent =
      "⚠️ Não foi possível sincronizar agora. A posição ficou salva localmente.";

    return false;
  }
}

function showError(message){

  started = false;

  $("state").textContent =
    "GPS indisponível";

  $("dot").className =
    "dot err";

  $("msg").textContent =
    message;

  $("start").hidden = false;
  $("stop").hidden = true;
  $("retry").hidden = false;
}

function start(){

  const nome =
    $("nome").value.trim();

  const id =
    $("id").value.trim();

  const pedido =
    $("pedido").value.trim();

  if(!nome || !id){

    $("msg").textContent =
      "⚠️ Informe o nome e o ID do entregador.";

    return;
  }

  if(!navigator.geolocation){

    showError(
      "Este navegador não oferece localização GPS."
    );

    return;
  }

  if(watchId !== null){
    return;
  }

  localStorage.setItem(
    "romaneio_entregador",
    JSON.stringify({
      nome,
      id,
      pedido
    })
  );

  $("msg").textContent =
    "📍 Solicitando permissão de localização...";

  $("state").textContent =
    "Solicitando GPS";

  $("dot").className =
    "dot warn";

  navigator.geolocation.getCurrentPosition(

    async position => {

      /*
       * Só consideramos o rastreamento iniciado
       * depois que o GPS realmente respondeu.
       */

      started = true;

      $("start").hidden = true;
      $("retry").hidden = true;
      $("stop").hidden = false;

      await processPosition(position);

      /*
       * Depois da primeira posição válida,
       * acompanha os movimentos.
       */

      watchId =
        navigator.geolocation.watchPosition(
          processPosition,
          gpsError,
          {
            enableHighAccuracy:true,
            maximumAge:5000,
            timeout:15000
          }
        );

    },

    error => {

      if(error.code === 1){

        showError(
          "🚫 Permissão de localização negada. Abra as permissões do navegador e permita a localização para este site."
        );

      }else if(error.code === 2){

        showError(
          "📍 Não foi possível encontrar sua localização. Ative o GPS do aparelho e tente novamente."
        );

      }else{

        showError(
          "⏱️ O GPS demorou para responder. Tente novamente."
        );

      }

    },

    {
      enableHighAccuracy:true,
      maximumAge:0,
      timeout:15000
    }

  );
}

async function processPosition(position){

  if(!started && watchId === null){
    return;
  }

  const now = Date.now();

  /*
   * Evita mandar dezenas de posições por segundo.
   * Uma atualização a cada 8 segundos é suficiente
   * para o primeiro teste.
   */

  if(now - lastSent < 8000){
    return;
  }

  lastSent = now;

  const payload = {

    entregador_id:
      $("id").value.trim(),

    nome:
      $("nome").value.trim(),

    latitude:
      position.coords.latitude,

    longitude:
      position.coords.longitude,

    status:
      "online",

    ultima_atualizacao:
      new Date().toISOString(),

    pedido_atual:
      $("pedido").value.trim() || null,

    updated_at:
      new Date().toISOString()
  };

  $("coords").textContent =
    payload.latitude.toFixed(6) +
    " , " +
    payload.longitude.toFixed(6);

  $("last").textContent =
    "Precisão aproximada: " +
    Math.round(position.coords.accuracy) +
    " m";

  $("state").textContent =
    "Online";

  $("dot").className =
    "dot on";

  await sendPosition(payload);
}

function gpsError(error){

  console.error(error);

  if(error.code === 1){

    showError(
      "🚫 Permissão de localização negada."
    );

  }else{

    $("msg").textContent =
      "⚠️ GPS temporariamente indisponível. Tentando continuar...";
  }
}

async function stop(){

  if(watchId !== null){

    navigator.geolocation.clearWatch(
      watchId
    );

    watchId = null;
  }

  started = false;

  const id =
    $("id").value.trim();

  const nome =
    $("nome").value.trim();

  if(id){

    await sendPosition({

      entregador_id:id,

      nome:nome || id,

      status:"offline",

      ultima_atualizacao:
        new Date().toISOString(),

      updated_at:
        new Date().toISOString()

    });
  }

  $("state").textContent =
    "Offline";

  $("dot").className =
    "dot";

  $("msg").textContent =
    "Rastreamento parado.";

  $("start").hidden = false;
  $("stop").hidden = true;
  $("retry").hidden = false;
}

$("start").addEventListener(
  "click",
  start
);

$("retry").addEventListener(
  "click",
  () => {

    $("retry").hidden = true;

    start();

  }
);

$("stop").addEventListener(
  "click",
  stop
);

window.addEventListener(
  "online",
  () => {

    $("msg").textContent =
      "🌐 Internet voltou. A próxima posição será sincronizada.";

  }
);

window.addEventListener(
  "offline",
  () => {

    if(started){

      $("msg").textContent =
        "📴 Sem internet. O GPS continua funcionando e a última posição fica salva neste aparelho.";

    }

  }
);

})();
</script>

</body>
</html>
