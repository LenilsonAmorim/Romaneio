<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Romaneio • Localização</title><style>body{margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#17202a}header{background:#111827;color:#fff;padding:18px 16px}.brand{font-size:22px;font-weight:800}.sub{opacity:.75;font-size:13px;margin-top:4px}main{max-width:600px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px #0001}button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;background:#111827;color:#fff}.muted{color:#66717d;font-size:13px;line-height:1.5}.coords{font-family:monospace;background:#f1f3f5;border-radius:10px;padding:12px;word-break:break-all}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#9ca3af;margin-right:6px}.on{background:#16a34a}</style></head><body><header><div class="brand">ROMANEIO</div><div class="sub">Modo entregador • compartilhamento de localização</div></header><main><div class="card"><h2>🏍️ Minha localização</h2><p class="muted">Mantenha esta tela aberta durante as entregas. O navegador solicitará permissão para usar o GPS.</p><button id="start">📍 Ativar localização</button><p id="msg" class="muted">Localização desativada.</p></div><div class="card"><div><span id="dot" class="dot"></span><b id="state">Aguardando</b></div><p class="muted">Última posição registrada:</p><div id="coords" class="coords">Nenhuma posição ainda.</div></div></main><script>let watchId=null;const $=id=>document.getElementById(id);$("start").onclick=()=>{if(!navigator.geolocation){$("msg").textContent="Este aparelho/navegador não oferece GPS.";return}if(watchId!==null)return;watchId=navigator.geolocation.watchPosition(pos=>{const lat=pos.coords.latitude.toFixed(6),lon=pos.coords.longitude.toFixed(6);$("coords").textContent="Latitude: "+lat+" | Longitude: "+lon;$("state").textContent="Localização ativa";$("dot").className="dot on";$("msg").textContent="GPS ativo. Precisão aproximada: "+Math.round(pos.coords.accuracy)+" m.";localStorage.setItem("ultima_localizacao",JSON.stringify({lat:Number(lat),lon:Number(lon),at:new Date().toISOString()}))},err=>{$("state").textContent="Não foi possível obter localização";$("msg").textContent=err.message},{enableHighAccuracy:true,maximumAge:10000,timeout:15000});$("start").textContent="📍 Localização ativada"};</script></body></html>
