name: Gerar APK Romaneio - Base Estavel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar projeto
        run: |
          echo "=== ESTRUTURA DO REPOSITÓRIO ==="
          find . -maxdepth 4 -type f | sort

          echo "=== PROJETOS GRADLE ==="
          find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "build.gradle" \
            -o -name "build.gradle.kts" \
          \) | sort

      - name: Procurar APK antigo
        run: |
          find . -type f -name "*.apk" -print || true

      - name: Procurar projeto Android
        run: |
          if [ -d "android" ]; then
            echo "Pasta android encontrada"
          elif [ -f "settings.gradle" ]; then
            echo "Projeto Gradle na raiz"
          elif [ -f "settings.gradle.kts" ]; then
            echo "Projeto Gradle Kotlin na raiz"
          else
            echo "Projeto Android ainda não está na estrutura esperada."
            exit 1
          fi
