name: Gerar APK Romaneio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar projeto Android
        run: |
          mkdir -p android-project
          unzip -q Romaneio_APK_WebView_AUTOATUALIZAVEL_v2.zip -d android-project

      - name: Gerar APK
        run: |
          cd android-project
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
