name: Gerar APK Romaneio

on:
  workflow_dispatch:
  push:
    paths:
      - "romaneio-apk.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q romaneio-apk.zip -d android-project

          echo "Projeto extraído:"
          find android-project -maxdepth 3 -type f | sort

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        working-directory: android-project
        run: |
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
