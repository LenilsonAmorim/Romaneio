name: Gerar APK Romaneio - Base Antiga Corrigida

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar projeto
        run: |
          echo "Verificando projeto Android..."
          test -f RomaneioBuild/android/settings.gradle
          test -f RomaneioBuild/android/build.gradle
          test -f RomaneioBuild/android/app/build.gradle
          echo "Projeto encontrado!"

      - name: Gerar APK
        run: |
          cd RomaneioBuild/android
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-APK-Corrigido
          path: RomaneioBuild/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
