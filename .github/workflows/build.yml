name: Gerar APK Romaneio - Icone Capa Atualizado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Procurar projeto Android
        run: |
          echo "Arquivos do projeto:"
          find . -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" \)

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar pasta Gradle
        id: gradle_project
        run: |
          ROOT=$(find . -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERRO: Nenhum projeto Gradle encontrado."
            exit 1
          fi

          echo "Projeto encontrado em: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Gerar APK
        run: |
          cd "${{ steps.gradle_project.outputs.root }}"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-Icone-Capa-Atualizado
          path: |
            **/build/outputs/apk/debug/*.apk
