name: Gerar APK Romaneio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar projeto Android
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q Romaneio_APK_WebView_ATUALIZADO.zip -d android-project

      - name: Verificar projeto
        run: |
          echo "Arquivos do projeto:"
          find android-project -maxdepth 3 -type f | sort

          test -f android-project/build.gradle
          test -f android-project/settings.gradle
          test -f android-project/app/build.gradle

      - name: Gerar APK
        working-directory: android-project
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Localizar APK
        run: |
          APK=$(find android-project -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p output
          cp "$APK" output/Romaneio.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio APK
          path: output/Romaneio.apk
          if-no-files-found: error
