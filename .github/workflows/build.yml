name: Gerar APK Rota Fácil

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto Rota Fácil
        run: |
          unzip -o RotaFacil_GitHub_Actions.zip -d projeto
          echo "Conteúdo extraído:"
          find projeto -maxdepth 4 -type f

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK
        working-directory: projeto
        run: |
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RotaFacil-APK
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
