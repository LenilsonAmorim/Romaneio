name: Gerar APK Romaneio

on:
  workflow_dispatch:
  push:
    paths:
      - "Romaneio/Organizador/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Criar projeto Android com o site atual
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir -p android-project/app/src/main/java/com/romaneio/app
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/assets

          # COPIA O SITE ATUAL PARA DENTRO DO APK
          cp -a Romaneio/Organizador/. android-project/app/src/main/assets/

          cat > android-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = 'Romaneio'
          include ':app'
          EOF

          cat > android-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > android-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > android-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.romaneio.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.romaneio.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > android-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Romaneio"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > android-project/app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#111827</item>
                  <item name="android:statusBarColor">#111827</item>
                  <item name="android:navigationBarColor">#111827</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF

          # ÍCONE R DO ROMANEIO
          cat > android-project/app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#111827"
                  android:pathData="M8,8 L100,8 L100,100 L8,100 Z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M31,27 L57,27 C71,27 78,34 78,45 C78,53 74,59 67,62 L81,81 L67,81 L55,65 L44,65 L44,81 L31,81 Z M44,38 L44,54 L55,54 C62,54 65,51 65,46 C65,41 62,38 55,38 Z" />

          </vector>
          EOF

          cat > android-project/app/src/main/java/com/romaneio/app/MainActivity.java <<'EOF'
          package com.romaneio.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();

                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setDatabaseEnabled(true);
                  settings.setBuiltInZoomControls(false);
                  settings.setDisplayZoomControls(false);
                  settings.setLoadWithOverviewMode(false);
                  settings.setUseWideViewPort(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  // ABRE EXATAMENTE O SITE ATUAL
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }

              }
          }
          EOF

          echo "====================================="
          echo "SITE COPIADO PARA O APK:"
          echo "====================================="

          find android-project/app/src/main/assets -maxdepth 2 -type f | sort

      - name: Gerar APK
        working-directory: android-project
        shell: bash
        run: |
          set -e

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          echo "=== APKs encontrados ==="

          find android-project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find android-project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          mkdir -p final

          cp "$APK" final/Romaneio.apk

          echo "====================================="
          echo "APK FINAL:"
          echo "final/Romaneio.apk"
          echo "====================================="

          ls -lh final/Romaneio.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-APK-CORRETO
          path: final/Romaneio.apk
          if-no-files-found: error
