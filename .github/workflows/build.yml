name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto Android do ZIP
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q Roteirizador_Android_Completo_para_GitHub.zip -d android-build

      - name: Gerar APK
        working-directory: android-build
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Roteirizador-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
