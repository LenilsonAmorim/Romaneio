name: Gerar APK Romaneio - Icone Capa Atualizado

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extrair projeto Android
        run: |
          rm -rf android-project
          mkdir android-project

          unzip -q -o romaneio-icon-capa-corrigido.zip -d android-project

          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle

      - name: Gerar APK
        run: |
          cd android-project
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-Icone-Capa-Atualizado
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
