name: Gerar APK Romaneio

on:
  workflow_dispatch:
  push:
    paths:
      - 'Romaneio_APK_AUTOATUALIZAVEL.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extrair projeto Android
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q Romaneio_APK_AUTOATUALIZAVEL.zip -d temp

          if [ -f temp/Romaneio_APK_AUTOATUALIZAVEL/settings.gradle ]; then
            cp -r temp/Romaneio_APK_AUTOATUALIZAVEL/. android-project/
          else
            cp -r temp/. android-project/
          fi

          echo "Projeto encontrado:"
          find android-project -maxdepth 3 -type f | sort

      - name: Gerar APK
        working-directory: android-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
