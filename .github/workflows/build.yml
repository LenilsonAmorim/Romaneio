name: Gerar APK Romaneio

on:
  workflow_dispatch:

  push:
    paths:
      - "romaneio-apk-filepicker-fixed.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extrair projeto Android
        shell: bash
        run: |
          set -e

          rm -rf android-project

          mkdir android-project

          unzip -q "romaneio-apk-filepicker-fixed.zip" -d android-project

          echo "Projeto extraído:"
          find android-project -maxdepth 6 -type f | sort

      - name: Corrigir MainActivity
        shell: bash
        run: |
          set -e

          MAIN="android-project/app/src/main/java/com/lenilson/romaneio/MainActivity.java"

          if [ ! -f "$MAIN" ]; then
            echo "ERRO: MainActivity.java não encontrada."
            echo "Arquivos encontrados:"
            find android-project -type f | sort
            exit 1
          fi

          # Corrige caracteres \n gravados literalmente
          # no arquivo Java.
          sed -i 's/\\n/\
/g' "$MAIN"

          echo "MainActivity corrigida."

          echo "Verificando configurações:"
          grep -n "SITE_URL\|loadUrl\|CacheMode" "$MAIN" || true

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          test -f android-project/settings.gradle
          test -f android-project/build.gradle
          test -f android-project/app/build.gradle
          test -f android-project/app/src/main/AndroidManifest.xml

          echo "Estrutura Android OK."

      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd android-project

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find android-project/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p final

          cp "$APK" "final/Romaneio.apk"

          echo "APK final:"
          ls -lh "final/Romaneio.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio.apk
          path: final/Romaneio.apk
          if-no-files-found: error
