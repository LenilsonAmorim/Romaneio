name: Gerar APK Romaneio - Base Antiga

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          rm -rf android-project
          mkdir -p android-project

          if [ -f "Romaneio-base-antiga-icone-capa.zip" ]; then
            unzip -q "Romaneio-base-antiga-icone-capa.zip" -d android-project
          elif [ -f "romaneio-apk.zip" ]; then
            unzip -q "romaneio-apk.zip" -d android-project
          else
            echo "ERRO: Nenhum pacote Android encontrado."
            exit 1
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Encontrar projeto Gradle
        id: gradle_project
        run: |
          ROOT=$(find android-project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "ERRO: Nenhum projeto Gradle encontrado dentro do pacote."
            find android-project -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Projeto Gradle encontrado em: $ROOT"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Gerar APK
        run: |
          cd "${{ steps.gradle_project.outputs.root }}"
          gradle assembleDebug --no-daemon

      - name: Localizar APK
        id: apk
        run: |
          APK=$(find android-project -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Romaneio Base Antiga
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
